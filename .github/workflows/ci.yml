name: Build and test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gravity-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.arduino15
            .tools
            .cache
          key: ${{ runner.os }}-arduino-1.6.0-esp32-3.0.7-v1
      - run: sh scripts/setup.sh
      - run: .venv/bin/ruff check scripts examples/gravity-clock/clock_control.py
      - run: .venv/bin/ruff format --check scripts examples/gravity-clock/clock_control.py
      - run: sh scripts/test.sh
      - run: .venv/bin/python scripts/build.py gravity-clock
